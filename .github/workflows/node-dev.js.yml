# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI DEV

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      renderer_version: ${{ steps.capture_version.outputs.renderer_version }}

    # strategy:
    #   matrix:
    #     node-version: [20.x, 22.x, 24.x]
    #     # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
      with:
        ref: "develop"
        fetch-depth: 0
    - name: Use Node.js 24.x
      uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: 'npm'
    - name: Pin npm
      run: npm install -g npm@11.6.2
    - run: npm ci
    - run: npm test
    - run: npx playwright install --with-deps chromium firefox webkit
    - run: npm run test:browser
    - name: Verify contact sheet is up to date
      run: |
        npm run contact-sheet
        git diff --exit-code contact.png docs/contact-sheet.svg docs/fonts/dejavu-sans.ttf
    # prerelease --preid=ci-$GITHUB_RUN_ID
    - run: npm version prerelease --preid=ci-$GITHUB_RUN_ID --no-git-tag-version
    - id: capture_version
      run: echo "renderer_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    - run: npm run build
    - run: npm pack
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: "*.tgz"

    - name: Trigger docs rebuild
      if: github.event_name == 'push'
      run: |
        set -o pipefail
        BEFORE="${{ github.event.before }}"
        SHA="${{ github.sha }}"
        if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
          CHANGED=""
          for commit in ${{ join(github.event.commits.*.id, ' ') }}; do
            git fetch --depth=1 origin "$commit"
            CHANGED+="$(git show --name-only --pretty=format: "$commit")"$'\n'
          done
        else
          git fetch --depth=1 origin "$BEFORE"
          CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
        fi
        if echo "$CHANGED" | grep -q '^docs/'; then
          curl -f -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/AbstractPlay/docs/dispatches \
          -d '{"event_type":"dep_update_dev"}'
        fi

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
        - name: Upload
          uses: actions/download-artifact@v4
          with:
              name: package
        - uses: actions/setup-node@v3
          with:
            node-version: 24
            registry-url: https://npm.pkg.github.com/
            scope: "@abstractplay"
        - name: Pin npm
          run: npm install -g npm@11.6.2
        - run: echo "registry=https://npm.pkg.github.com/@abstractplay" >> .npmrc
        - run: npm publish $(ls *.tgz) --tag development
          env:
            NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  deploy-playground:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
    - name: Pin npm
      run: npm install -g npm@11.6.2
    - run: npm ci
    - run: npm run dist-dev
    - name: Configure AWS credentials
      uses: Fooji/create-aws-profile-action@v1
      with:
        profile: AbstractPlayDev
        region: us-east-1
        key: ${{ secrets.AWS_KEY }}
        secret: ${{ secrets.AWS_SECRET }}
    - name: Deploy playground
      env:
        AWS_SDK_LOAD_CONFIG: "1"
        AWS_PROFILE: AbstractPlayDev
      run: npm run deploy:ci

  relay:
    needs: [deploy-playground, build]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger gameslib build and test
        env:
          RENDERER_VERSION: ${{ needs.build.outputs.renderer_version }}
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/abstractplay/gameslib/dispatches \
          -d "$(jq -n --arg v "$RENDERER_VERSION" '{event_type:"dep_update_dev", client_payload:{renderer_version:$v}}')"

