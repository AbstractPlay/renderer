<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>APRender browser test harness</title>
        <script src="APRender.min.js"></script>
        <script src="playground-samples.js"></script>
    </head>
    <body>
        <div id="drawing"></div>
        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var sampleKey = params.get("sample");
                var drawing = document.getElementById("drawing");

                if (!sampleKey || !PLAYGROUND_SAMPLES[sampleKey]) {
                    document.body.dataset.rendered = "error";
                    document.body.dataset.error = "missing or unknown sample: " + sampleKey;
                    drawing.innerHTML = "<pre id=\"error\">" + document.body.dataset.error + "</pre>";
                    return;
                }

                try {
                    var json = JSON.parse(PLAYGROUND_SAMPLES[sampleKey].render);
                    APRender.render(json, { divid: "drawing" });
                    document.body.dataset.sample = sampleKey;
                    document.body.dataset.rendered = "true";
                } catch (err) {
                    document.body.dataset.rendered = "error";
                    document.body.dataset.error = err && err.message ? err.message : String(err);
                    drawing.innerHTML = "<pre id=\"error\">" + document.body.dataset.error + "</pre>";
                }
            })();
        </script>
    </body>
</html>
